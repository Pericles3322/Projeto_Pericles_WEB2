<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400"
      rel="stylesheet"
    />

    <title>PC-Stock | Login</title>
    <script type="module" crossorigin src="/Projeto_Pericles_WEB2/assets/login-BvfMUyqc.js"></script>
    <link rel="modulepreload" crossorigin href="/Projeto_Pericles_WEB2/assets/auth-BSo14gqT.js">
    <link rel="stylesheet" crossorigin href="/Projeto_Pericles_WEB2/assets/auth-BlToqiUE.css">
  </head>
  <body data-page="login">
    <main class="login-wrapper d-flex align-items-center justify-content-center">
      <div class="login-glow"></div>
      <div class="login-card">
        <div class="text-center mb-4">
          <h1 class="font-headline h2 mb-2">PC-Stock</h1>
          <p class="text-secondary mb-0">Entre com sua conta para acessar o inventário.</p>
        </div>

        <form id="login-form" class="d-grid gap-3">
          <div>
            <label class="form-label-kinetic" for="email">E-mail</label>
            <input
              id="email"
              class="form-control form-control-kinetic"
              type="email"
              placeholder="Email"
              required
            />
          </div>
          <div>
            <label class="form-label-kinetic" for="senha">Senha</label>
            <input
              id="senha"
              class="form-control form-control-kinetic"
              type="password"
              placeholder="Senha"
              required
            />
          </div>
          <button class="btn btn-kinetic w-100" type="submit">Entrar</button>
        </form>

        <div class="mt-4 text-secondary small text-center">
          Usuário de teste: <strong>cliente@email.com</strong> / <strong>123456</strong>
        </div>
      </div>
    </main>

  </body>
</html>
